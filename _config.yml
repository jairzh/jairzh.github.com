# Site
name: "Jair Zheng"
title: "Jair Talks Salesforce"
description: "Notes on Salesforce, AI and architecture."
logo: ''
favicon: 'assets/images/favicon.ico'
url: 'https://jairzh.com'
baseurl: ''
google_analytics: 'G-GQH825L9LL'
mailchimp-list:
include: ["_pages"]
permalink: /blog/:year/:month/:day/:title
timezone: Asia/Shanghai
lang: zh-CN

# English translations stay separate so Chinese pagination and archives keep their URLs.
collections:
  english_posts:
    output: true
    permalink: /en/blog/:name/

defaults:
  - scope:
      path: ""
    values:
      lang: zh-CN
      locale: zh_CN
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US
  - scope:
      path: ""
      type: english_posts
    values:
      layout: post
      author: jair
      lang: en
      locale: en_US

# Authors
authors:
  jair:
    name: Jair Zheng
    display_name: Jair
    gravatar: d0dc091fd18b2d2961459aeb394d09c1
    email: jairzh@live.com
    web: https://jairzh.com
    twitter: https://twitter.com/jairzheng
    linkedin: https://www.linkedin.com/in/jairzh/
    description: 'In the Salesforce ecosystem since 2010, 20+ Salesforce certifications (incl. System and Application Architect). Building <a href="https://www.charket.ai/?utm_source=blog&utm_medium=author_bio&utm_campaign=jairzh_com" target="_blank">Charket</a>.'


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'

# Pagination
paginate: 9
paginate_path: /page:num/

# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
